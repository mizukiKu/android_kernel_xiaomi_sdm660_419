name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Clone Zyc Clang 22.0.0
        run: |
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b 22 /tmp/zyc

      - name: Android kernel build (Zyc Clang 22 + Full LTO + POLLY)
        uses: lemniskett/android-kernel-actions@master
        id: build
        env:
          NAME: RezzzzFy
        with:
          arch: arm64
          compiler: clang
          clang-path: /tmp/zyc
          defconfig: whyred_defconfig
          image: Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: ${{ steps.build.outputs.outfile }}
