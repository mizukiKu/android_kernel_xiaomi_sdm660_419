name: RezzzFy Project

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: SUKISU ULTRA setup
        run: |
          curl -LSs "https://raw.githubusercontent.com/kerjarodipp-glitch/SukiSU-Ultra/refs/heads/susfs-main/kernel/setup.sh" | bash -s susfs-main

      - name: Run kernel source helper scripts
        run: |
          set -euo pipefail

          echo "Running scripts/mkcompile_h ..."
          if [ -f scripts/mkcompile_h ]; then
            chmod +x scripts/mkcompile_h
            scripts/mkcompile_h
          else
            echo "scripts/mkcompile_h not found."
          fi

          echo "Running build-all.py ..."
          if [ -f build-all.py ]; then
            chmod +x build-all.py
            ./build-all.py
          else
            echo "build-all.py not found."
          fi

      - name: Android kernel build
        uses: lemniskett/android-kernel-actions@master
        id: build
        env:
          NAME: RezzzFy
        with:
          arch: arm64
          compiler: gcc/12
          defconfig: vendor/whyred-perf_defconfig
          image: Image.gz-dtb

      - name: Prepare image.xz and kernel.dtb
        shell: bash
        run: |
          set -euo pipefail
          infile="${{ steps.build.outputs.outfile }}"

          mkdir -p out
          cp "$infile" out/Image.gz-dtb

          gunzip -c out/Image.gz-dtb > out/Image
          xz -z -9 -c out/Image > out/image.xz

          DTB_OUT="out/kernel.dtb"
          if [ -f "./scripts/extract-dtb.py" ]; then
            python3 ./scripts/extract-dtb.py out/Image.gz-dtb "$DTB_OUT" || true
          else
            touch "$DTB_OUT"
          fi

      - name: Upload Built Kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-kernel
          path: out/
