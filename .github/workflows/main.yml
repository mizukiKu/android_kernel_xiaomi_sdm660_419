name: Build kernel (ZyC Clang 15.0.7) - whyred-perf

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      DEFCONFIG: vendor/whyred-perf_defconfig
      KERNEL_OUT: out
      # ZyC Clang 15.0.7 tarball (dari file Clang-15-link.txt yang kamu tampilkan)
      ZYC_DEFAULT_URL: "https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare env variables
        run: |
          echo "ZYC_URL=${{ env.ZYC_DEFAULT_URL }}" >> $GITHUB_ENV
          echo "O=${{ env.KERNEL_OUT }}" >> $GITHUB_ENV
          echo "ARCH=${{ env.ARCH }}" >> $GITHUB_ENV
          echo "DEFCONFIG=${{ env.DEFCONFIG }}" >> $GITHUB_ENV

      - name: Download & extract Zyc Clang
        run: |
          set -e
          mkdir -p /opt/zyc
          TMPF=/tmp/zyc_toolchain.tar.gz
          echo "Downloading Zyc Clang from $ZYC_URL"
          curl -L --retry 5 --silent --show-error "${ZYC_URL}" -o "$TMPF"
          # Extract (handles .tar.gz/.tar.xz)
          if file "$TMPF" | grep -q 'gzip compressed'; then
            tar -xzf "$TMPF" -C /opt/zyc
          elif file "$TMPF" | grep -q 'XZ compressed'; then
            tar -xJf "$TMPF" -C /opt/zyc
          else
            tar -xf "$TMPF" -C /opt/zyc
          fi
          # try to find a bin directory inside extraction and add to PATH
          BIN_DIR=$(find /opt/zyc -type d -name bin -print | head -n1 || true)
          if [ -n "$BIN_DIR" ]; then
            echo "$BIN_DIR" >> $GITHUB_PATH
            echo "Added $BIN_DIR to PATH"
          else
            # sometimes clang itself sits in top-level folder
            # try to find clang binary
            CLANG_PATH=$(find /opt/zyc -type f -name clang -print | head -n1 || true)
            if [ -n "$CLANG_PATH" ]; then
              CLANG_BIN_DIR=$(dirname "$CLANG_PATH")
              echo "$CLANG_BIN_DIR" >> $GITHUB_PATH
              echo "Added $CLANG_BIN_DIR to PATH"
            else
              echo "Warning: clang not found inside extracted toolchain. Listing /opt/zyc:"
              ls -la /opt/zyc || true
            fi
          fi

      - name: Show toolchain & debug
        run: |
          echo "PATH: $PATH"
          echo "clang -> $(which clang || true)"
          clang --version || true
          echo "aarch64-linux-gnu-as -> $(which aarch64-linux-gnu-as || true)"
          aarch64-linux-gnu-as --version || true

      - name: Ensure aarch64 assembler (binutils) available
        run: |
          set -e
          if command -v aarch64-linux-gnu-as >/dev/null 2>&1; then
            echo "Cross assembler present: $(which aarch64-linux-gnu-as)"
          else
            echo "Installing binutils-aarch64-linux-gnu"
            sudo apt-get update
            sudo apt-get install -y binutils-aarch64-linux-gnu
          fi
          echo "which aarch64-linux-gnu-as: $(which aarch64-linux-gnu-as || echo none)"
          aarch64-linux-gnu-as --version || true

      - name: Prepare out dir & defconfig
        run: |
          mkdir -p $O
          make O=$O ARCH=$ARCH $DEFCONFIG

      - name: Build kernel (Clang/LLVM - Zyc)
        run: |
          set -e
          export O=$O
          export ARCH=${ARCH}
          # use clang from extracted toolchain (already on PATH)
          export CC=clang
          export HOSTCC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LD=ld.lld
          # ensure CROSS_COMPILE points to cross binutils prefix (will use installed or toolchain-provided)
          export CROSS_COMPILE=aarch64-linux-gnu-
          # show chosen bins
          echo "Using CC: $(which $CC || true)"
          echo "Using AR: $(which $AR || true)"
          echo "Using CROSS_COMPILE as: $CROSS_COMPILE (which -> $(which ${CROSS_COMPILE}as || true))"
          # run the build
          make -j$(nproc) O=$O ARCH=$ARCH CC=$CC HOSTCC=$HOSTCC \
            AR=$AR NM=$NM OBJCOPY=$OBJCOPY OBJDUMP=$OBJDUMP STRIP=$STRIP LD=$LD \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Create Image.gz and collect artifacts
        run: |
          set -e
          OUTDIR=$O/arch/arm64/boot
          mkdir -p build_output
          # copy Image if exists and create Image.gz
          if [ -f "$OUTDIR/Image" ]; then
            cp "$OUTDIR/Image" build_output/Image
            gzip -9 -c "$OUTDIR/Image" > build_output/Image.gz
            echo "Created build_output/Image.gz from Image"
          elif [ -f "$OUTDIR/Image.gz" ]; then
            cp "$OUTDIR/Image.gz" build_output/Image.gz
          else
            echo "No Image found at $OUTDIR"
          fi
          # copy Image.gz-dtb if produced
          if [ -f "$OUTDIR/Image.gz-dtb" ]; then
            cp "$OUTDIR/Image.gz-dtb" build_output/Image.gz-dtb
          fi
          # copy dtbs if any
          if ls "$OUTDIR"/*.dtb 1> /dev/null 2>&1; then
            cp "$OUTDIR"/*.dtb build_output/ || true
          fi
          # copy other useful artifacts
          cp -a "$O"/System.map* build_output/ 2>/dev/null || true
          cp -a "$O"/modules* build_output/ 2>/dev/null || true
          # full out tree as fallback/debug
          cp -a $O build_output/kernel_out || true
          ls -la build_output || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: build_output
