name: Kernel Build - Whyred Perf (WeebX Clang)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compile Kernel (whyred-perf)
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gcc clang lld git \
            libncurses-dev libssl-dev zip lzop python3 python3-pip \
            rsync unzip wget xz-utils

      - name: Clone WeebX Clang
        run: |
          git clone --depth=1 https://gitlab.com/XSans0/weebx-clang.git clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Setup Kernel Defconfig (whyred-perf_defconfig)
        run: |
          mkdir -p out
          make O=out ARCH=arm64 whyred-perf_defconfig

      - name: Build Kernel
        run: |
          export KBUILD_BUILD_USER="github-actions"
          export KBUILD_BUILD_HOST="github"
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
      
      - name: Verify Build Outputs
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "❌ Image.gz not found!"
            exit 1
          fi
          if [ ! -f out/arch/arm64/boot/dts/qcom/whyred.dtb ]; then
            echo "❌ kernel.dtb not found!"
            exit 1
          fi

      - name: Compress Image to Image.xz
        run: |
          mkdir -p out_artifacts
          xz -c out/arch/arm64/boot/Image.gz > out_artifacts/Image.xz
          cp out/arch/arm64/boot/dts/qcom/whyred.dtb out_artifacts/kernel.dtb

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Whyred-Perf
          path: out_artifacts/
