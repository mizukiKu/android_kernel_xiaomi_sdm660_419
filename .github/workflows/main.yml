name: Build kernel (whyred-perf -> image.xz + kernel.dtb)

on:
  workflow_dispatch:
    inputs:
      clang_url:
        description: 'Direct download URL for ZyC clang 22 tarball (or set secret ZYC_CLANG_URL)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      DEFCONFIG: vendor/whyred-perf_defconfig
      OUT_DIR: out
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare dirs
      run: |
        mkdir -p toolchain
        mkdir -p ${{ env.OUT_DIR }}

    - name: Download ZyC clang 22 (input or secret)
      run: |
        if [ -n "${{ github.event.inputs.clang_url }}" ]; then
          CLANG_URL="${{ github.event.inputs.clang_url }}"
        elif [ -n "${{ secrets.ZYC_CLANG_URL }}" ]; then
          CLANG_URL="${{ secrets.ZYC_CLANG_URL }}"
        else
          echo "ERROR: provide CLANG URL as workflow input or secret ZYC_CLANG_URL"
          exit 1
        fi
        echo "Downloading clang from: ${CLANG_URL}"
        curl -L --retry 5 -o toolchain/clang.tar.xz "${CLANG_URL}"
        tar -xf toolchain/clang.tar.xz -C toolchain
        # locate bin dir
        CLANG_BIN=$(find toolchain -maxdepth 3 -type d -name "bin" | head -n1)
        if [ -z "$CLANG_BIN" ]; then
          echo "Cannot find clang bin dir inside extracted archive"
          ls -R toolchain
          exit 1
        fi
        echo "CLANG_BIN=${CLANG_BIN}" >> $GITHUB_ENV

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libncurses5-dev libssl-dev curl xz-utils lzop

    - name: Add clang to PATH
      run: |
        echo "${CLANG_BIN}" >> $GITHUB_PATH
        echo "PATH now contains: $(echo $PATH | tr ':' '\n' | tail -n5)"

    - name: Show tool versions
      run: |
        clang --version || true
        ${CLANG_BIN}/clang --version || true
        which clang || true

    - name: Create defconfig (vendor/whyred-perf_defconfig)
      run: |
        make ARCH=${ARCH} O=${OUT_DIR} ${DEFCONFIG}

    - name: Build kernel + dtbs
      env:
        CC: clang
        CLANG_TRIPLE: aarch64-linux-gnu-
        LD: ld.lld
        AR: llvm-ar
        NM: llvm-nm
        OBJCOPY: llvm-objcopy
        OBJDUMP: llvm-objdump
      run: |
        # build Image and dtbs in one go
        make -j$(nproc) ARCH=${ARCH} O=${OUT_DIR} \
          CC=${CC} CLANG_TRIPLE=${CLANG_TRIPLE} LLVM=1 \
          LD=${LD} AR=${AR} NM=${NM} OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP}
        # build dtbs explicitly (some trees require explicit target)
        make -j$(nproc) ARCH=${ARCH} O=${OUT_DIR} dtbs

    - name: Verify build outputs
      run: |
        echo "Listing possible image and dtb outputs:"
        ls -lah ${OUT_DIR}/arch/arm64/boot || true
        find ${OUT_DIR} -type f -name '*.dtb' -print || true

    - name: Create image.xz from Image
      run: |
        KIMG="${OUT_DIR}/arch/arm64/boot/Image"
        if [ -f "$KIMG" ]; then
          # compress with xz (parallel)
          xz -T0 -z -9 -k -f "$KIMG"
          # move result to repo root artifact
          if [ -f "${KIMG}.xz" ]; then
            mv "${KIMG}.xz" ./image.xz
          else
            echo "Expected ${KIMG}.xz but not found"
            exit 1
          fi
        else
          # try zImage
          if [ -f "${OUT_DIR}/arch/arm64/boot/zImage" ]; then
            xz -T0 -z -9 -k -f "${OUT_DIR}/arch/arm64/boot/zImage"
            mv "${OUT_DIR}/arch/arm64/boot/zImage.xz" ./image.xz
          else
            echo "No Image or zImage found to compress"
            exit 1
          fi
        fi
        echo "image.xz created."

    - name: Create kernel.dtb by concatenating DTBs
      run: |
        # Prefer vendor dts first (common for Android vendor dtbs), then any other dtbs
        OUTDTB="./kernel.dtb"
        rm -f $OUTDTB
        # vendor dtbs (if any)
        find ${OUT_DIR}/arch/arm64/ -path '*/dts/vendor/*' -type f -name '*.dtb' -print0 | sort -z | xargs -0 -r cat >> $OUTDTB || true
        # other dtbs
        find ${OUT_DIR}/arch/arm64/ -type f -name '*.dtb' -not -path '*/dts/vendor/*' -print0 | sort -z | xargs -0 -r cat >> $OUTDTB || true
        if [ ! -s $OUTDTB ]; then
          echo "No dtb files found to create kernel.dtb"
          exit 1
        fi
        echo "kernel.dtb created (size: $(stat -c%s $OUTDTB) bytes)"

    - name: Upload artifacts (image.xz + kernel.dtb + build log)
      uses: actions/upload-artifact@v4
      with:
        name: whyred-perf-kernel
        path: |
          image.xz
          kernel.dtb
          ${OUT_DIR}/build.log
