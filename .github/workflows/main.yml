name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc \
            binutils-dev \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            cmake \
            curl \
            file \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            make \
            ninja-build \
            python3-dev \
            texinfo \
            u-boot-tools \
            xz-utils \
            zlib1g-dev

      - name: Clone Zyc tc-build
        run: |
          git clone --depth=1 https://github.com/ZyCromerZ/tc-build.git /tmp/tc-build

      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Android kernel build (Clang)
        uses: lemniskett/android-kernel-actions@master
        id: build
        env:
          NAME: RezzzzFy
        with:
          arch: arm64
          compiler: clang
          defconfig: whyred_defconfig
          image: Image.gz-dtb

      - name: Upload Kernel (Image.gz-dtb)
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: ${{ steps.build.outputs.outfile }}

      - name: Upload Image.xz
        uses: actions/upload-artifact@v4
        with:
          name: image-xz
          path: out/arch/arm64/boot/Image.xz

      - name: Upload kernel.dtb
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb
          path: out/arch/arm64/boot/dts/**/*.dtb
